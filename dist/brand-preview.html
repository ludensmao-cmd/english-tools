<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>English.tools — проверка логотипа</title>
  <style>
    :root{font-family:Manrope,system-ui,sans-serif;color:#f7f2fa;background:#100e14}
    *{box-sizing:border-box}body{max-width:1000px;margin:auto;padding:48px 24px 80px}
    h1{font-size:32px;letter-spacing:-.04em}p{color:#bab1c1}
    .samples{margin-top:28px}
    .sample{border:1px solid #39323e;border-radius:16px;background:#1b1820;padding:25px;min-width:0}
    .sample h2{font-size:16px}.large{display:grid;place-items:center;height:250px;overflow:hidden;position:relative}
    .raster{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,100%);max-width:none}
    .sizes{display:flex;align-items:center;gap:27px;margin-top:20px;padding:18px 0;border-top:1px solid #39323e}
    .sizes img{display:block;width:210px;height:105px;object-fit:contain}
    .sizes img:last-child{width:160px;height:80px}
    @media(max-width:700px){.sizes{flex-wrap:wrap}}
  </style>
</head>
<body>
  <h1>English.tools в логике Lobby</h1>
  <p>Тот же логотип на прозрачном фоне, как он выглядит в шапке и подвале сайта.</p>
  <div class="samples">
    <div class="sample"><h2>Логотип English.tools</h2><div class="large"><img class="raster" src="/brand/english-tools-transparent.png" alt="Логотип English.tools на основе Lobby"></div><div class="sizes"><img src="/brand/english-tools-transparent.png" alt="Размер в шапке"><img src="/brand/english-tools-transparent.png" alt="Размер в подвале"></div></div>
  </div>
</body>
</html>
